<style>
/* Layout: fixed left rail with seven sections, one working area on the right.
   Dark navy is the home palette (taken from the presentation); light is the alternate. */
:root {
  --bg: #070c20;
  --panel: #0e1631;

  --bad: #ff6178;
  --warn: #ffb84a;

  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eff3fb; --panel: #ffffff; --panel-2: #e8eef9; --line: #cfd8ec;
    --fg: #0c1533; --muted: #566287; --cyan: #006f9c; --ok: #08804b;
    --bad: #c4223b; --warn: #9a5b00; --on-accent: #ffffff;
    --cyan-soft: rgba(0, 111, 156, .10); --ok-soft: rgba(8, 128, 75, .10);
    --bad-soft: rgba(196, 34, 59, .09); --warn-soft: rgba(154, 91, 0, .10);
    color-scheme: light;

}
:root[data-theme="light"] {
  --bg: #eff3fb; --panel: #ffffff; --panel-2: #e8eef9; --line: #cfd8ec;
  --fg: #0c1533; --muted: #566287; --cyan: #006f9c; --ok: #08804b;
  --bad: #c4223b; --warn: #9a5b00; --on-accent: #ffffff;
  --cyan-soft: rgba(0, 111, 156, .10); --ok-soft: rgba(8, 128, 75, .10);
  --bad-soft: rgba(196, 34, 59, .09); --warn-soft: rgba(154, 91, 0, .10);
  color-scheme: light;

* { box-sizing: border-box; }
body {

.head { display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ok); }
h1 { font-size: 30px; font-weight: 900; line-height: 1.15; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }

.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.btn {

.form-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.msg { font-size: 13px; min-height: 1.4em; }
.msg.bad { color: var(--bad); }
.msg.ok { color: var(--ok); }

.sw { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); transition: background .15s; }

.sw input:checked + span { background: var(--ok-soft); border-color: var(--ok); }
.sw input:checked + span::after { transform: translateX(18px); background: var(--ok); }
.sw input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: 2px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }

.statusbig { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

      var t = state.tunnel;
      root.innerHTML =
        '<section class="card"><div class="flow"><div class="tunnelbox"><div class="tag"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span id="tTag">Shifrlangan VPN tunnel</span></div>' +
        '<div class="node">' + NODE_SVG.user + 'Foydalanuvchi</div><span class="link" aria-hidden="true"></span><div class="node net">' + NODE_SVG.net + 'Internet</div><span class="link" aria-hidden="true"></span><div class="node srv">' + NODE_SVG.srv + 'VPN Server</div></div>' +
        '<span class="link plain" aria-hidden="true" style="align-self:center"></span><div class="node" style="align-self:center">' + NODE_SVG.lan + 'Ichki tarmoq</div></div>' +
        '<p class="small muted" style="margin-top:16px;max-width:80ch">Ochiq internet segmentida ma\'lumot himoyalangan. Serverdan ichki tarmoqqa trafik allaqachon autentifikatsiyadan o\'tgan, ishonchli trafik sifatida yuboriladi.</p></section>' +
        '<section class="card"><header><h2>Tashqi kuzatuvchi nimani ko\'radi?</h2></header>' +
        '<form id="demoForm" class="toolbar" style="margin-bottom:14px" novalidate><div class="grow"><input type="text" id="demoText" maxlength="60" value="Hisobot: 2026 yil 3-chorak" aria-label="Yuboriladigan xabar" autocomplete="off"></div><button class="btn primary" type="submit">Paketni yuborish</button></form>' +
        '<div class="demo" id="demo"></div><p class="small muted" style="margin-top:12px">Namuna: shifrlangan qator tasodifiy baytlardan hosil qilinadi va faqat ko\'rsatma uchun mo\'ljallangan. Haqiqiy shifrlash tanlangan protokol tomonidan bajariladi.</p></section>';
      $('#demoForm').addEventListener('submit', function (e) { e.preventDefault(); runDemo(); });
      runDemo(true);
    },
    refresh: function () { var t = state.tunnel, el = $('#tTag'); if (el) el.textContent = 'Shifrlangan VPN tunnel · ' + t.proto + ' · ' + t.cipher; }
  };
  var demoTimers = [];
  function runDemo(instant) {
    var el = $('#demo'); if (!el) return;
    demoTimers.forEach(clearTimeout); demoTimers = [];
    var text = ($('#demoText').value || 'Salom').slice(0, 60);
    var n = new TextEncoder().encode(text).length + 16, arr = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    var hex = Array.prototype.map.call(arr, function (b) { return b.toString(16).padStart(2, '0'); }).join(' ');
    var rows = [
      ['Foydalanuvchi qurilmasi', 'plain', 'Ochiq matn: ' + text],
      ['Ochiq internet segmenti', 'enc', hex],
      ['VPN server → ichki tarmoq', 'plain', 'Deshifrlandi: ' + text]
    ];
    el.innerHTML = rows.map(function (r, i) { return '<div class="stage pending" id="st' + i + '"><span class="who">' + esc(r[0]) + '</span><span class="what">' + (instant ? '' : 'kutilmoqda…') + '</span></div>'; }).join('');
    rows.forEach(function (r, i) {
      var show = function () { var s = $('#st' + i); if (!s) return; s.className = 'stage ' + r[1]; s.lastChild.textContent = r[2]; };
      if (instant || reduce) show(); else demoTimers.push(setTimeout(show, i * 650));
    });
  }

  /* ---- Steps ---- */
  var STEPS = [
    ['VPN texnologiyasini tanlash', 'Ehtiyojga qarab turini va protokolni tanlang: Remote Access yoki Site-to-Site, WireGuard yoki IPsec.', 'tunnel', 'Protokolni tanlash'],
    ['Serverni tayyorlash', 'Operatsion tizimni yangilang, doimiy IP manzil va kerakli portlarni belgilang.', 'tunnel', 'Server parametrlari'],
    ['Autentifikatsiyani sozlash', 'Foydalanuvchilarga kalit yoki sertifikat bering, ikki bosqichli tasdiqlashni yoqing.', 'foydalanuvchilar', 'Foydalanuvchilar'],
    ['Shifrlangan tunnel yaratish', 'Shifrlash algoritmini, ichki tarmoq manzillarini va MTU qiymatini kiriting, tunnelni ishga tushiring.', 'tunnel', 'Tunnel sozlamalari'],
    ['Firewall sozlash', 'VPN portini oching, keraksiz portlarni yoping, qolgan trafikni standart bo\'yicha rad eting.', 'firewall', 'Firewall qoidalari'],
    ['Mijoz qurilmalarini ulash', 'Har bir qurilmaga konfiguratsiya bering va ulanishni tekshiring.', 'foydalanuvchilar', 'Ulanishlarni ko\'rish'],
    ['Sinov va monitoring', 'Yopiq portlarni sinang, jurnalni kuzating va yangilanishlarni muntazam o\'rnating.', 'jurnal', 'Jurnalni ochish']
  ];
  views.bosqichlar = {
    eyebrow: 'Amaliy jarayon', title: 'Xavfsiz tarmoq yaratish bosqichlari',
    lead: 'Yetti bosqich ketma-ket bajariladi. Tugagan bosqichni belgilab boring.',
    mount: function (root) {
      root.innerHTML = '<section class="card"><div class="score" style="margin-bottom:10px"><span class="n mono" id="stepN"></span><span class="muted">bosqich bajarildi</span></div><div class="progress"><i id="stepBar"></i></div></section><ol class="steps" id="steps"></ol>';
      root.addEventListener('change', function (e) {
        var t = e.target; if (t.dataset && t.dataset.step !== undefined) { state.steps[+t.dataset.step] = t.checked; store('vpn-steps', JSON.stringify(state.steps)); views.bosqichlar.refresh(); }
      });
    },
    refresh: function () {
      var done = state.steps.filter(Boolean).length;
      $('#stepN').textContent = done + ' / 7';
      $('#stepBar').style.width = Math.round(done / 7 * 100) + '%';
      $('#steps').innerHTML = STEPS.map(function (s, i) {
        return '<li class="step' + (state.steps[i] ? ' done' : '') + '"><input type="checkbox" id="step' + i + '" data-step="' + i + '"' + (state.steps[i] ? ' checked' : '') + ' aria-labelledby="stepT' + i + '"><div><h3 id="stepT' + i + '">' + (i + 1) + '. ' + esc(s[0]) + '</h3><p>' + esc(s[1]) + '</p></div><a class="btn sm ghost" href="#' + s[2] + '">' + esc(s[3]) + '</a></li>';
      }).join('');
    }
  };

  /* ---------- shell ---------- */
  function chrome() {
    var p = $('#srvPill'), eff = effective();
    p.className = 'pill ' + (eff ? 'ok' : state.tunnel.running ? 'warn' : 'bad');
    p.textContent = eff ? 'Server ishlamoqda' : state.tunnel.running ? 'Port bloklangan' : 'Server to\'xtagan';
  }
  function route() {
    var id = (location.hash || '').slice(1);
    cur = views[id] ? id : 'boshqaruv';
    demoTimers.forEach(clearTimeout);
    $('#nav').innerHTML = NAV.map(function (n) { return '<a href="#' + n[0] + '"' + (n[0] === cur ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n[0]] + '</svg>' + n[1] + '</a>'; }).join('');
    var v = views[cur], main = $('#main');
    main.innerHTML = '<div class="head"><span class="eyebrow">' + esc(v.eyebrow) + '</span><h1>' + esc(v.title) + '</h1><p class="lead">' + esc(v.lead) + '</p></div><div class="stack" id="view"></div>';
    v.mount($('#view'));
    v.refresh();
    document.title = 'VPN Boshqaruv Paneli';
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  main_delegates();
  function main_delegates() {
    $('#main').addEventListener('click', function (e) { var b = e.target.closest('[data-act^="srv-"]'); if (b && cur === 'boshqaruv') srvAct(b.dataset.act); });
  }

  /* theme */
  function effTheme() { var t = document.documentElement.getAttribute('data-theme'); return t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
  var st = store('vpn-theme'); if (st === 'light' || st === 'dark') document.documentElement.setAttribute('data-theme', st);
  $('#themeBtn').addEventListener('click', function () {
    var n = effTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store('vpn-theme', n);
    if (cur === 'boshqaruv') renderChart();
  });

  /* ---------- simulation ---------- */
  var ATTACK_PORTS = [['TCP', 23], ['TCP', 80], ['TCP', 445], ['TCP', 3389], ['TCP', 8080], ['TCP', 5900]];
  function ip() { return pick(['203.0.113.', '198.51.100.', '192.0.2.']) + Math.floor(rnd(2, 250)); }
  function tick() {
    var eff = effective(), now = Date.now();
    if (!eff) {
      state.users.forEach(function (u) { if (u.status === 'online') { u.status = 'offline'; u.seen = now; } });
      if (state.tunnel.running && !tick.warned) { log('warn', 'VPN porti firewall tomonidan bloklangan, ulanishlar uzildi'); tick.warned = true; }
    } else {
      tick.warned = false;
      state.users.forEach(function (u) {
        if (u.status === 'online') { u.seen = now; if (Math.random() < .04) { u.status = 'offline'; log('info', u.name + ' uzildi (' + u.ip + ')'); } }
        else if (u.status === 'offline' && Math.random() < .07) { u.status = 'online'; u.seen = now; log('ok', u.name + ' ulandi (' + u.ip + ', ' + state.tunnel.proto + ')'); }
      });
    }
    var online = onlineUsers().length, rx = 0, tx = 0;
    if (eff && online) { rx = Math.max(.4, online * 2.6 * rnd(.55, 1.35)); tx = rx * rnd(.25, .5); }
    state.rx.push(rx); state.rx.shift(); state.tx.push(tx); state.tx.shift();
    state.totalMB += (rx + tx) * 2 / 8;
    if (Math.random() < .14) {
      var a = pick(ATTACK_PORTS), res = evalRule(a[0], a[1], 'internet');
      if (res.action === 'deny') { state.blocked++; log('block', 'Bloklandi: ' + ip() + ' → ' + a[0] + ' ' + a[1] + (res.rule ? ' (' + res.rule.desc + ')' : ' (standart siyosat)')); }
      else if (res.off && Math.random() < .5) log('warn', 'Firewall o\'chiq: ' + ip() + ' dan ' + a[0] + ' ' + a[1] + ' portiga ulanish o\'tkazildi');
    }
    chrome();
    if (cur === 'boshqaruv') { renderKpis(); renderChart(); renderAlert(); renderScore(); renderTypes(); }
    else if (cur === 'foydalanuvchilar') renderUsers();
    else if (cur === 'tunnel') { var s = $('#tStatus'); if (s && !s.contains(document.activeElement)) views.tunnel.refresh(); }
  }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (cur === 'boshqaruv') renderChart(); }, 120); });
  document.addEventListener('visibilitychange', function () { });

  route(); chrome();
  setInterval(tick, 2000);
})();
</script>

</body></html>
